name: ERTS Mirror

on:
  # ---------------------------------------------------------------------------
  #  Triggers
  # ---------------------------------------------------------------------------

  # Weekly Monday 06:00 UTC — discover new OTP versions and build what's
  # missing on the main branch. Resilient to single-job failures so a
  # broken arm64 build doesn't cancel the rest.
  schedule:
    - cron: "0 6 * * 1"

  # Manual trigger. The `version`, `targets` and `regenerate_from_zero`
  # inputs let you (re)build a single release, a subset, or wipe the
  # manifest and start over.
  workflow_dispatch:
    inputs:
      version:
        description: "OTP version to (re)build, e.g. 28.4.2. Leave empty to detect."
        required: false
        type: string
      targets:
        description: "Comma-separated targets. Leave empty for all 8."
        required: false
        type: string
        default: "linux-glibc-amd64,linux-glibc-arm64,linux-musl-amd64,linux-musl-arm64,darwin-amd64,darwin-arm64,windows-amd64,windows-arm64"
      regenerate_from_zero:
        description: "Delete every existing release and MANIFEST entry, then rebuild from scratch. DANGEROUS."
        required: false
        type: boolean
        default: false
      min_version:
        description: "Only build OTP versions >= this. Default 27.0 (we don't ship legacy ERTS for older OtP)."
        required: false
        type: string
        default: "27.0"

  # Run on push to main so the new commits that bump MANIFEST.json via
  # the `manifest-commit` job trigger a fresh detect+build cycle.
  push:
    branches: [main]
    paths:
      - "MANIFEST.json"
      - "scripts/**"
      - ".github/workflows/erts.yml"

  # Run on PRs to main — only the cheap `lint` job, no heavy builds.
  pull_request:
    branches: [main]

permissions:
  contents: write # to create releases + push manifest changes

jobs:
  # -------------------------------------------------------------------------
  #  lint — quick syntax/JSON sanity check. Runs on every PR and on push.
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every .sh
        run: |
          set -e
          for f in $(find scripts -maxdepth 2 -name '*.sh'); do
            echo "checking $f"
            bash -n "$f"
          done

      - name: jq on MANIFEST.json
        run: |
          set -e
          test -f MANIFEST.json || { echo "no MANIFEST.json (yet)"; exit 0; }
          jq -e 'type == "object"' MANIFEST.json >/dev/null

  # -------------------------------------------------------------------------
  #  detect — compute the (version, target) build matrix. Emits every
  #  pair that doesn't yet have a published asset on the corresponding
  #  release, so it catches both new OTP versions AND missing targets
  #  on existing versions. Only runs on schedule / manual / push to
  #  main, not on PRs.
  # -------------------------------------------------------------------------
  detect:
    name: Detect missing version-target pairs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gh + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Handle regenerate_from_zero
        id: reset
        if: ${{ inputs.regenerate_from_zero == true }}
        run: |
          echo "regenerate_from_zero=true — deleting every release and wiping MANIFEST.json"
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            echo "  deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tags || true
          done
          echo '{}' > MANIFEST.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json
          git commit -m "chore(erts): wipe MANIFEST.json for regenerate_from_zero" || true
          git push || true

      - name: Detect missing version-target pairs
        id: detect
        env:
          DETECT_MIN_VERSION: ${{ inputs.min_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/*.sh
          # Default to the 7 targets the GH Actions matrix can actually
          # build. darwin-amd64 needs a paid macOS runner (we only have
          # macos-14) and windows-arm64 has no upstream prebuild. The
          # manifest-regenerate job (below) reconciles darwin-amd64 with
          # whatever the user has uploaded manually.
          if [[ -n "${{ inputs.targets }}" ]]; then
            targets_filter="${{ inputs.targets }}"
          else
            targets_filter="linux-glibc-amd64 linux-glibc-arm64 linux-musl-amd64 linux-musl-arm64 darwin-arm64 windows-amd64"
          fi
          # Manual version override → cross product with targets_filter
          if [[ -n "${{ inputs.version }}" ]]; then
            matrix="$(jq -nc --arg versions "${{ inputs.version }}" --arg targets "$targets_filter" '
              ($versions | split(",") | map(select(. != ""))) as $vs
              | ($targets  | split(" ") | map(select(. != ""))) as $ts
              | { include: [ $vs[] as $v | $ts[] as $t | { version: $v, target: $t } ] }
            ')"
          else
            # No manual version: walk every (version, target) pair and
            # emit the ones that haven't already been uploaded as an
            # asset on the corresponding release tag. This catches
            # both the "new OTP version" case AND the "existing
            # version is missing a target" case.
            matrix="$(. ./scripts/_lib.sh && . ./scripts/01-detect.sh && \
              _compute_build_plan $targets_filter \
              | jq -R -s 'split("\n") | map(select(. != "")) | map(split(" ")) | { include: map({ version: .[1], target: .[0] }) }'
            )"
          fi
          # Add the right GH Actions runner for each target. The 4
          # linux glibc/musl × amd64/arm64 builds run in docker on
          # ubuntu; the macos and windows builds need their native
          # runners.
          runner_overrides='{"linux-glibc-amd64":"ubuntu-latest","linux-glibc-arm64":"ubuntu-latest","linux-musl-amd64":"ubuntu-latest","linux-musl-arm64":"ubuntu-latest","darwin-arm64":"macos-14","windows-amd64":"windows-latest"}'
          matrix="$(echo "$matrix" | jq --argjson runners "$runner_overrides" \
            '.include |= map(. + { runner: ($runners[.target] // "ubuntu-latest") })')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "computed matrix:"
          echo "$matrix" | jq .

  # -------------------------------------------------------------------------
  #  build — one job per (target, version) pair. Each runs the appropriate
  #  script in `scripts/`.
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }} / OTP ${{ matrix.version }}
    needs: detect
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo apt-get clean

      - name: Install gh, jq, docker
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Run ${{ matrix.target }} build
        env:
          BATAMANTA_DRY_RUN: "0"
          BATAMANTA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/erts-${{ matrix.target }}.sh ${{ matrix.version }}

      - name: Upload tarball as artifact (debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: ignore
          retention-days: 3

  # -------------------------------------------------------------------------
  #  manifest-regenerate — walks every OTP-* release on the repo via the
  #  GitHub API and rebuilds MANIFEST.json from scratch. This catches
  #  drift caused by builds uploaded manually from a macOS host (which
  #  GH Actions can't provide — darwin-amd64 is the canonical example)
  #  or by a CI race where the upload succeeded but the in-run
  #  manifest_set_entry didn't. The script targets all 8 supported
  #  keys; obsolete entries are dropped.
  # -------------------------------------------------------------------------
  manifest-regenerate:
    name: Regenerate MANIFEST.json from releases
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install gh + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh python3

      - name: Regenerate MANIFEST.json from the live release set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/*.sh ./scripts/*.py
          # --no-commit: the manifest-commit job downstream does the
          # actual commit + push, so we can keep a single tidy diff
          # for the whole cycle.
          ./scripts/regenerate-manifest.py --no-commit --min-version "${{ inputs.min_version }}"

  # -------------------------------------------------------------------------
  #  manifest-commit — if manifest-regenerate produced any changes,
  #  commit + push them to main.
  # -------------------------------------------------------------------------
  manifest-commit:
    name: Commit MANIFEST.json
    needs: manifest-regenerate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Commit & push any manifest changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain MANIFEST.json)" ]]; then
            git add MANIFEST.json
            git commit -m "chore(erts): update MANIFEST.json [skip ci]"
            git push
          else
            echo "no manifest changes"
          fi
